# Runs the 18 tests on every push and PR. About ten milliseconds of the minute
# this job takes is the tests; the rest is checkout and npm ci.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
