<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="card">
    <h1>Bill Splitter</h1>
    <p class="sub">Subtotal, tax, tip, people. What does everyone owe?</p>

    <form id="form">
      <label>Subtotal ($)
        <input id="subtotal" type="number" step="0.01" min="0" value="48.50" required>
      </label>
      <label>Tax rate (%)
        <input id="taxRate" type="number" step="0.01" min="0" value="8.25" required>
      </label>
      <label>Tip (%)
        <input id="tipPercent" type="number" step="1" min="0" value="18" required>
      </label>
      <label>People
        <input id="people" type="number" step="1" min="1" value="3" required>
      </label>
    </form>

    <section id="result" class="result" aria-live="polite"></section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
